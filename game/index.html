<!DOCTYPE html>
<!-- Ember Court — an original card battler built for the make.fun bounty. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — Make the best card game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%237a1f1f'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23d4af37'%3E%E2%96%B2%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #17100b;
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 18%, rgba(214, 96, 32, 0.22), rgba(214, 96, 32, 0) 70%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(120, 40, 12, 0.35), rgba(120, 40, 12, 0) 70%),
      linear-gradient(180deg, #241610 0%, #17100b 55%, #100a07 100%);
    color: #f3e3c8;
    font-family: Georgia, "Times New Roman", serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #ember-court {
    display: block;
    width: min(1280px, 100%);
    height: auto;
    max-width: 100%;
    aspect-ratio: 1280 / 800;
    border: 2px solid #6b3a1a;
    border-radius: 14px;
    box-shadow: 0 0 0 4px #2a170c, 0 18px 60px rgba(0, 0, 0, 0.65), 0 0 90px rgba(214, 96, 32, 0.14);
    background: #1d130c;
  }
  @media (max-width: 560px) {
    body { padding: 8px; }
    #ember-court { border-radius: 8px; }
  }
</style>
</head>
<body>
<canvas id="ember-court" width="1280" height="800"></canvas>
<script src="src/config.js"></script>
<script src="src/cards.js"></script>
<script src="src/ai.js"></script>
<script src="src/render.js"></script>
<script src="src/input.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
